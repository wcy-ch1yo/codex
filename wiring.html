<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>炫彩音乐灯 · 接线 3D</title>
<style>
  :root{
    --bg:#0b0e13;
    --bg2:#121821;
    --panel:#151b25;
    --panel2:#1b2330;
    --line:#26303f;
    --line2:#323e50;
    --fg:#e8eef7;
    --fg2:#9fb0c6;
    --fg3:#6d7d92;
    --acc:#41dcff;
    --acc2:#ff4fd8;
    --ok:#5ee6a8;
    --warn:#ffcc57;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .app{display:flex;height:100vh;width:100vw}

  /* ---------- 侧栏 ---------- */
  .side{
    width:340px;flex:0 0 340px;height:100%;overflow-y:auto;overflow-x:hidden;
    background:linear-gradient(180deg,#141b25 0%,#10161f 100%);
    border-right:1px solid var(--line);
    padding:16px 16px 40px;
  }
  .side::-webkit-scrollbar{width:9px}
  .side::-webkit-scrollbar-thumb{background:#2b3646;border-radius:9px}
  .side::-webkit-scrollbar-track{background:transparent}
  .brand h1{font-size:17px;margin:0 0 4px;letter-spacing:.2px}
  .brand h1 span{color:var(--acc)}
  .brand p{margin:0 0 14px;font-size:11.5px;color:var(--fg3);line-height:1.6}
  .tagline{
    display:inline-block;font-size:10.5px;color:var(--acc);
    border:1px solid rgba(65,220,255,.35);background:rgba(65,220,255,.08);
    border-radius:99px;padding:2px 9px;margin-bottom:10px;
  }
  section{margin:0 0 14px;border-top:1px solid var(--line);padding-top:12px}
  section h2{
    font-size:11px;letter-spacing:.14em;color:var(--fg3);margin:0 0 9px;
    text-transform:uppercase;font-weight:600;
  }
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button{
    font:inherit;font-size:12px;color:var(--fg);
    background:var(--panel2);border:1px solid var(--line2);
    border-radius:8px;padding:7px 8px;cursor:pointer;transition:.15s;
  }
  button:hover{background:#233042;border-color:#43536b}
  button.on{background:rgba(65,220,255,.16);border-color:var(--acc);color:#d6f6ff}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);padding:4px 0;cursor:pointer}
  .chk input{accent-color:var(--acc);width:14px;height:14px}
  select{
    width:100%;font:inherit;font-size:12.5px;color:var(--fg);background:var(--panel2);
    border:1px solid var(--line2);border-radius:8px;padding:7px 8px;cursor:pointer;
  }
  .hint{font-size:11px;color:var(--fg3);margin-top:7px;line-height:1.6}

  /* BOM */
  .bom{display:flex;flex-direction:column;gap:5px}
  .row{
    display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;
    background:var(--panel);border:1px solid transparent;cursor:pointer;transition:.13s;
  }
  .row:hover{background:var(--panel2);border-color:var(--line2)}
  .row.on{background:rgba(65,220,255,.12);border-color:var(--acc)}
  .row .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:0 0 7px;background:var(--fg3)}
  .row .txt{flex:1;min-width:0}
  .row .r1{font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .r2{font-size:10.5px;color:var(--fg3);margin-top:1px}
  .row .r3{font-size:10.5px;color:var(--acc);margin-top:1px}
  .row .qty{font-size:10.5px;color:var(--acc);flex:0 0 auto;margin-top:1px}

  /* 详情 */
  .detail{
    background:linear-gradient(180deg,#1a2430,#141c26);border:1px solid var(--line2);
    border-radius:11px;padding:12px;
  }
  .detail h3{margin:0 0 2px;font-size:14px}
  .detail .sub{font-size:11px;color:var(--acc);margin-bottom:9px}
  .kv{display:grid;grid-template-columns:74px 1fr;gap:3px 8px;font-size:11.5px}
  .kv dt{color:var(--fg3)}
  .kv dd{margin:0;color:var(--fg2)}
  .detail p{font-size:11.5px;color:var(--fg2);margin:9px 0 0;line-height:1.7}
  .pinmap{width:100%;border-collapse:collapse;font-size:11px}
  .pinmap td{padding:3px 2px;border-bottom:1px solid #20283441;color:var(--fg2);vertical-align:top}
  .pinmap td:first-child{color:var(--acc);white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
  .legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11px;color:var(--fg2)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .note{font-size:11px;color:var(--fg3);line-height:1.75}
  .note b{color:var(--fg2);font-weight:600}

  /* ---------- 视口 ---------- */
  main{position:relative;flex:1;min-width:0;height:100%}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  .float{
    position:absolute;top:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap;
    justify-content:flex-end;max-width:calc(100% - 28px);
  }
  .float button{backdrop-filter:blur(8px);background:rgba(21,27,37,.82)}
  /* 加载 / 兜底提示层 */
  .boot{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;text-align:center;padding:26px;background:radial-gradient(circle at 50% 42%,#182231,#0a0e14 72%);
    z-index:5;
  }
  .boot h2{margin:0;font-size:17px;color:#e8eef7}
  .boot p{margin:0;font-size:12px;color:#9fb0c6;max-width:560px;line-height:1.75}
  .boot .tip{font-size:11px;color:#6d7d92;max-width:520px}
  .boot .spin{
    width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(65,220,255,.22);
    border-top-color:#41dcff;animation:sp 900ms linear infinite;margin:4px 0;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .boot.noscript{gap:11px}
  .boot.noscript h2{color:#ffcc57}
  .boot.noscript b{color:#e8eef7}
  .boot.noscript hr{width:70%;border:0;border-top:1px solid #26303f;margin:6px 0}
  .boot img{max-width:min(600px,88%);border:1px solid #26303f;border-radius:10px;margin:2px 0}

  /* ---------- 静态兜底页：打开方式不运行脚本时显示 ---------- */
  .staticwrap{
    position:fixed;inset:0;z-index:99;overflow:auto;-webkit-overflow-scrolling:touch;
    background:#0e1116;color:#e8eef7;padding:22px 16px 70px;
    font:14px/1.7 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  }
  .staticwrap h1{font-size:20px;margin:0 0 6px}
  .staticwrap h2{font-size:15px;color:#41dcff;margin:24px 0 8px}
  .staticwrap .lead{color:#9fb0c6;font-size:12.5px;margin:0 0 12px}
  .staticwrap .warn{
    background:rgba(255,204,87,.10);border:1px solid rgba(255,204,87,.42);color:#ffcc57;
    border-radius:10px;padding:11px 13px;font-size:12.5px;margin:0 0 16px;
  }
  .staticwrap .warn b{color:#ffe6a8}
  .staticwrap img{
    width:100%;max-width:1100px;display:block;border:1px solid #26303f;
    border-radius:10px;margin:0 0 6px;background:#0b0e13;
  }
  .staticwrap .cap{color:#6d7d92;font-size:11.5px;margin:0 0 20px}
  .staticwrap table{width:100%;max-width:1100px;border-collapse:collapse;font-size:11.5px}
  .staticwrap th{background:#0e7f8c;color:#fff;padding:7px 6px;text-align:left;position:sticky;top:0}
  .staticwrap td{border-bottom:1px solid #26303f;padding:6px;color:#c3d0de;vertical-align:top}
  .staticwrap tr:nth-child(even) td{background:rgba(255,255,255,.022)}
  .staticwrap .foot{color:#6d7d92;font-size:11.5px;margin-top:18px}
  .staticwrap table{border:1px solid #26303f;border-radius:8px;overflow:hidden}
  .staticwrap .dim{color:#7d8ea3}
  /* 2D 布局示意（纯 CSS 画，不用图片） */
  .bwrap{width:100%;max-width:720px;margin:6px 0 8px}
  .bmain{
    position:relative;width:100%;padding-top:77.78%;background:#1a6b50;
    border:1px solid #0c3b2c;border-radius:6px;
  }
  .bmain.bpanel{padding-top:100%}
  .cmp{
    position:absolute;background:var(--c);border:1px solid rgba(0,0,0,.4);border-radius:2px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font:700 clamp(5px,1.35vw,10px)/1 "Microsoft YaHei",system-ui,sans-serif;
    color:#06131a;letter-spacing:-.2px;
  }
  .hole{position:absolute;background:#08131a;border-radius:50%}
  .leddot{position:absolute;background:#ff4fd8;border-radius:15%}
  /* 洞洞板孔位网格 */
  .gl{position:absolute;background:rgba(255,255,255,.11)}
  .gl.v{width:1px;top:0;bottom:0}
  .gl.h{height:1px;left:0;right:0}
  .gnum{
    position:absolute;color:rgba(232,238,247,.8);
    font:600 9px/1 "Microsoft YaHei",system-ui,sans-serif;
    transform:translate(-50%,-50%);white-space:nowrap;
  }
  .staticwrap .gridnote{color:#41dcff;font-size:11.5px;margin:2px 0 10px}
  .hud{
    position:absolute;left:16px;bottom:14px;font-size:11.5px;color:var(--fg3);
    background:rgba(11,14,19,.66);border:1px solid var(--line);border-radius:9px;
    padding:7px 11px;backdrop-filter:blur(8px);line-height:1.7;pointer-events:none;
  }
  .hud b{color:var(--fg2);font-weight:600}
  .scalebox{
    position:absolute;right:16px;bottom:14px;font-size:11px;color:var(--fg3);
    background:rgba(11,14,19,.66);border:1px solid var(--line);border-radius:9px;
    padding:7px 11px;backdrop-filter:blur(8px);pointer-events:none;text-align:right;
  }
  .scalebox b{color:var(--acc);font-weight:600}

  @media (max-width:900px){
    .app{flex-direction:column}
    .side{width:100%;flex:0 0 auto;max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}
    main{flex:1}
    .app.hide-side .side{display:none}
  }
  .app.hide-side .side{display:none}
</style>
</head>
<body>
<div class="app">
  

  <main>
  <div id="hiddenui" style="display:none">
    <input type="checkbox" id="tLabels">
    <input type="checkbox" id="tZones">
    <input type="checkbox" id="tRuler">
    <input type="checkbox" id="tSilk" checked>
    <input type="checkbox" id="tSolder" checked>
    <input type="checkbox" id="tPanel" checked>
    <input type="checkbox" id="tExplode">
    <input type="checkbox" id="spin">
    <select id="pattern"><option value="demo" selected>demo</option></select>
    <button id="btnSide"></button>
    <button id="btnStatic"></button>
    <div class="bom" id="bom"></div>
    <div class="detail" id="detail"></div>
  </div>
    <canvas id="c"></canvas>
    <div class="float">
      <button id="btnMain3D" onclick="window.open('mainboard.html','_blank')">主板 3D</button>
      <button id="btnBack2" onclick="document.getElementById('tSolder').checked=true;document.querySelector('[data-view=bottom]').click()">看背板接线</button>
      <button id="btnReset">重置视角</button>
      <button id="btnSpin">自动旋转</button>
      <button id="btnFull">全屏</button>
    </div>
    <div class="hud">拖动 <b>左键</b> 旋转 · 滚轮 <b>缩放</b> · <b>右键</b> 平移<br><b style="color:#ffbe3c">橙色实线</b>＝锡桥 / 引脚搭桥　<b style="color:#78b2e4">蓝灰虚线</b>＝跳线 / 母线</div>
    <div class="scalebox" id="scalebox"></div>
  </main>
</div>

<div id="static" class="staticwrap">
<h1>炫彩音乐灯 · 接线 3D</h1>
<p class="lead">这是<b>接线专用页</b>：显示主板与灯阵板的接线（橙色＝锡桥 / 引脚搭桥，蓝灰虚线＝跳线 / 母线）。当前打开方式没有运行网页脚本，请保存后选「用其他应用打开 → 浏览器」。</p>
<p class="cap">主板 90 × 70 mm ｜ 灯阵板 70 × 70 mm ｜ 主板 31 列 × 24 行孔</p>
</div>

<script>
"use strict";
/*__PART_DATA__*/
/* =======================================================================
   1. 板子与布局数据
   坐标系：布局坐标 (x, y) 以板子左上角为原点，x 向右、y 向下，单位 mm。
   显示给用户的 PCB 坐标：X = x，Y = 80 - y（原点在板左下角）。
   ======================================================================= */
const BOARD = { w:90, h:70, t:1.6, r:2.5 };
/* 独立的 8×8 灯阵模块（不焊在主板上），坐标为它在同一布局平面中的位置 */
const PANEL = { w:70, h:70, x:102, y:0, t:1.6, pitch:8.0 };
/* 洞洞板（万能板）栅格：孔距 2.54 mm，孔区离板边 5 mm，第 1 个孔心再内缩 1.27 mm
   → 90 × 70 的主板正好 31 列 × 24 行，70 × 70 的灯阵板 24 列 × 24 行 */
const HOLE = 2.54, HOLE_EDGE = 5, HOLE0 = HOLE_EDGE + 1.27;
const holeCols = w => Math.floor((w - 2 * HOLE_EDGE - 1.27) / HOLE) + 1;
const holeRows = h => Math.floor((h - 2 * HOLE_EDGE - 1.27) / HOLE) + 1;
/* 主板 J5 → 灯阵板引出线 的 3 根杜邦线（起止点与弧顶，布局坐标，z 为离板高度） */
const CABLE = { from:[84.0, 58.65, 3.2], to:[103.4, 58.65, 3.2], ctl:[94, 63, 12] };

const C = {
  mask:   [0x1a,0x6b,0x50],   // 绿油
  maskEdge:[0x11,0x4a,0x37],
  copper: [0xa5,0x76,0x3a],   // 底层铜
  silk:   [0xf2,0xf6,0xfa],   // 丝印
  bluepill:[0x1f,0x5f,0xa8],
  bluepillEdge:[0x15,0x46,0x7e],
  btg:    [0x12,0x31,0x5e],
  led:    [0xe9,0xef,0xf4],
  chip:   [0x14,0x16,0x1a],
  plastic:[0x25,0x29,0x30],
  metal:  [0xb9,0xc0,0xc8],
  gold:   [0xcf,0xa9,0x3f],
  black:  [0x0d,0x0f,0x12],
  capTan: [0xc9,0xb1,0x89],
  res:    [0x2a,0x2a,0x2e],
  capBulk:[0x2d,0x37,0x42],
  red:    [0xc0,0x3a,0x3a],
  grey:   [0x8f,0x99,0xa6],
  hole:   [0x08,0x0a,0x0c],
  metalFilm:[0x9f,0xb6,0xd0],  // 金属膜电阻本体（淡蓝）
  disc:   [0xc9,0x88,0x5a],    // 瓷片电容本体
  discTop:[0xdf,0xa5,0x78],
  mono:   [0xd0,0xac,0x38],    // 独石电容
  monoTop:[0xe4,0xc4,0x58],
  term:   [0x2f,0x6b,0x40],    // 螺钉端子绿壳
  termTop:[0x39,0x7c,0x4b]
};

/* 灯阵图案（1 = 点亮），行序自上而下，与题目“8 字节自高到低、8 行自上而下”一致 */
const BITS = {
  heart: ['00000000','01100110','11111111','11111111','11111111','01111110','00111100','00011000'],
  smile: ['00111100','01000010','10100101','10000001','10100101','10011001','01000010','00111100'],
  arrow: ['00000000','00011000','00111000','11111111','11111111','00111000','00011000','00000000'],
  fft:   ['00011000','00011000','00011000','00111100','01111110','01111110','11111111','11111111']
};
const OFF_LED = [120,128,140];

/* 功能分区（用于 2D 叠加色块） */
/* 功能分区（5 个大区 + 独立灯阵板），元件之间留 2–3 个孔位间隙 */
/* 功能分区（5 个大区 + 独立灯阵板），元件之间留 2–3 个孔位间隙 */
const ZONES = [
  { id:'A', name:'音频输入与调理区', x0:2,  y0:2,    x1:50, y1:22.5, color:[143,123,255] },
  { id:'C', name:'蓝牙通信区',     x0:74, y0:6,    x1:88, y1:22.5,   color:[94,230,168] },
  { id:'D', name:'交互按键区',       x0:2,  y0:23,   x1:31, y1:46.5, color:[255,204,87] },
  { id:'G', name:'主控区',           x0:32, y0:23,   x1:88, y1:46.5, color:[79,163,255] },
  { id:'E', name:'电源与对外接口区', x0:2,  y0:47.5, x1:88, y1:68,   color:[255,160,90] },
  { id:'M', name:'灯阵模块（独立小板）', x0:100, y0:-1, x1:174, y1:71, color:[255,79,216] }
];

/* 锡桥 / 飞线标注：每段 = 两个孔的（列, 行），t:'b' 锡桥 · t:'w' 跳线/母线 */
const BRIDGES = [
  /* ---- 电源与对外接口区（主板下端，重点） ---- */
  { c1:4,  r1:2,  c2:8,  r2:2,  t:'b', n:'电源+ → 开关中间脚（跨过不焊的第 3 脚）' },
  { c1:9,  r1:2,  c2:12, r2:4,  t:'b', n:'开关侧脚 → C4+' },
  { c1:2,  r1:2,  c2:2,  r2:7,  t:'w', n:'GND 母线（沿下端走）' },
  { c1:2,  r1:7,  c2:31, r2:7,  t:'w', n:'GND 母线 → 各模块' },
  { c1:14, r1:4,  c2:14, r2:7,  t:'b', n:'C4− → GND' },
  { c1:12, r1:4,  c2:18, r2:1,  t:'w', n:'5V 母线 → D1 阳极' },
  { c1:29, r1:4,  c2:30, r2:3,  t:'b', n:'R7 → J5 · IN' },
  { c1:24, r1:4,  c2:14, r2:9,  t:'w', n:'PA6 → R7（灯阵数据）' },
  { c1:22, r1:1,  c2:29, r2:1,  t:'w', n:'5V 母线（沿板边）→ J5' },
  { c1:29, r1:1,  c2:29, r2:3,  t:'b', n:'→ J5 · V+' },
  /* ---- 地线与 3.3 V 分配（这些之前漏画了） ---- */
  { c1:31, r1:3,  c2:31, r2:7,  t:'w', n:'J5 第3脚 V → GND 母线' },
  { c1:10, r1:24, c2:16, r2:24, t:'w', n:'→ 音频区 GND 排' },
  { c1:10, r1:9,  c2:12, r2:9,  t:'w', n:'GND → U1 的 GND 脚' },
  { c1:2,  r1:11, c2:2,  r2:3,  t:'w', n:'按键 GND → 地母线' },
  { c1:2,  r1:3,  c2:4,  r2:1,  t:'b', n:'' },
  { c1:12, r1:18, c2:10, r2:18, t:'w', n:'U2 第4脚 → GND' },
  { c1:16, r1:23, c2:16, r2:24, t:'b', n:'' },
  { c1:16, r1:24, c2:20, r2:24, t:'b', n:'音频区 GND 排（C3 / J2 / D2 / R2 就近搭上）' },
  { c1:20, r1:24, c2:20, r2:23, t:'b', n:'' },
  { c1:19, r1:23, c2:15, r2:16, t:'w', n:'3.3V → 分压电阻 R1' },
  { c1:17, r1:18, c2:17, r2:21, t:'w', n:'C2 / C5 的 GND 就近搭地' },
  /* ---- 蓝牙模块的 4 个脚 ---- */
  { c1:29, r1:3,  c2:30, r2:19, t:'w', n:'5V → J8 第5脚（5V）' },
  { c1:31, r1:3,  c2:30, r2:20, t:'w', n:'J8 第4脚（GND）→ 地母线' },
  { c1:30, r1:21, c2:16, r2:16, t:'w', n:'J8 第3脚 TXD → PA10' },
  { c1:30, r1:22, c2:17, r2:16, t:'w', n:'J8 第2脚 RXD → PA9' },
  /* ---- 灯阵数据：从 MCU 到串阻 ---- */
    /* ---- 音频区（信号链，全部 ≤2 孔） ---- */

/* MCU 引脚分配（用于侧栏表格，已在 HTML 中静态给出） */
/*__PART_GEOM__*/
/* =======================================================================
   2. 几何构建：把元件清单变成三角/四边面网格
   ======================================================================= */
const MESHES = [];
const PART_BY_REF = new Map();
PARTS.forEach(p => PART_BY_REF.set(p.ref, p));
const ledWindows = [];          // 64 个灯珠发光面，用于切换图案

/* 布局坐标 → 世界坐标（世界：X 右、Y 上、Z 向上，原点在板中心） */
function W3(x, y, z){ return [x - BOARD.w / 2, BOARD.h / 2 - y, z]; }

function addMesh(verts, faces, color, ref, opts){
  const o = opts || {};
  MESHES.push({
    v: verts, f: faces, color: color.slice(),
    fc: o.faceColors || null,
    ref: ref, part: ref ? PART_BY_REF.get(ref) : null,
    emissive: !!o.emissive,
    ex: o.ex === undefined ? 0 : o.ex
  });
}

/* 长方体：中心 (cx,cy)，z0 起，沿 x/y/z 尺寸 w,d,h */
function box(cx, cy, z0, w, d, h, color, ref, opts){
  const X0 = cx - w / 2, X1 = cx + w / 2;
  const Y0 = cy - d / 2, Y1 = cy + d / 2;
  const a = W3(X0, Y1, z0), b = W3(X1, Y1, z0), c = W3(X1, Y0, z0), e = W3(X0, Y0, z0);
  const A = W3(X0, Y1, z0 + h), B = W3(X1, Y1, z0 + h), Cc = W3(X1, Y0, z0 + h), E = W3(X0, Y0, z0 + h);
  const v = [].concat(a, b, c, e, A, B, Cc, E);
  const f = [
    [4, 5, 6, 7],   // 顶 +z
    [0, 3, 2, 1],   // 底 -z
    [0, 1, 5, 4],   // 世界 -y 面
    [2, 3, 7, 6],   // 世界 +y 面
    [3, 0, 4, 7],   // 世界 -x 面
    [1, 2, 6, 5]    // 世界 +x 面
  ];
  addMesh(v, f, color, ref, opts);
}

/* 圆柱：起点 (ax,ay,az)，沿 along = 'x'|'y'|'z' 长 len，半径 r（布局坐标） */
function cyl(ax, ay, az, along, len, r, color, ref, opts, seg){
  seg = seg || 18;
  const n = seg, v = [], f = [];
  const pt = (t, ang) => {
    const cc = Math.cos(ang), ss = Math.sin(ang);
    if (along === 'z') return W3(ax + r * cc, ay + r * ss, az + t * len);
    if (along === 'x') return W3(ax + t * len, ay + r * cc, az + r * ss);
    return W3(ax + r * cc, ay + t * len, az + r * ss);
  };
  for (let i = 0; i < n; i++){
    const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2;
    v.push(...pt(0, a0), ...pt(0, a1), ...pt(1, a1), ...pt(1, a0));
    f.push([i * 4, i * 4 + 3, i * 4 + 2, i * 4 + 1]);
  }
  const cStart = along === 'z' ? W3(ax, ay, az) : (along === 'x' ? W3(ax, ay, az) : W3(ax, ay, az));
  const cEnd = along === 'z' ? W3(ax, ay, az + len) : (along === 'x' ? W3(ax + len, ay, az) : W3(ax, ay + len, az));
  const iEnd = v.length / 3; v.push(...cEnd);
  const iStart = v.length / 3; v.push(...cStart);
  for (let i = 0; i < n; i++){
    const k = i * 4, k2 = ((i + 1) % n) * 4;
    f.push([iEnd, k2, k]);
    f.push([iStart, k + 1, k2 + 1]);
  }
  addMesh(v, f, color, ref, opts);
}

/* 排针（dir: 'x' 沿 x 排布，'y' 沿 y 排布） */
function header(cx, cy, n, dir, ref, opts){
  opts = opts || {}; opts.ex = opts.ex || 5;
  const L = n * 2.54;
  const w = dir === 'x' ? L : 2.54, d = dir === 'x' ? 2.54 : L;
  box(cx, cy, 0, w, d, 2.54, C.plastic, ref, opts);
  for (let i = 0; i < n; i++){
    const off = (i - (n - 1) / 2) * 2.54;
    const px = dir === 'x' ? cx + off : cx, py = dir === 'x' ? cy : cy + off;
    box(px, py, 2.54, 0.64, 0.64, 5.6, C.gold, ref, opts);
  }
}

/* ---------------- 各类元件外形 ---------------- */

function buildLEDArray(p){
  const n = 8, pitch = p.pitch;
  const x0 = p.x - pitch * (n - 1) / 2, y0 = p.y - pitch * (n - 1) / 2;
  for (let j = 0; j < n; j++){
    for (let i = 0; i < n; i++){
      const cx = x0 + i * pitch, cy = y0 + j * pitch;
      const o = { ex: 12, faceColors: { top: C.led } };
      box(cx, cy, 0, 4.6, 4.6, 0.16, [0x1c,0x20,0x26], p.ref, o);     // 黑色封装底
      for (const dx2 of [-1.9, 1.9]) for (const dy2 of [-1.9, 1.9])
        box(cx + dx2, cy + dy2, 0.16, 0.9, 0.9, 0.14, C.gold, p.ref, o); // 四角焊盘
      box(cx, cy, 0.16, 4.2, 4.2, 0.76, C.led, p.ref, o);              // 白色灯罩
      box(cx - 1.75, cy - 1.75, 0.9, 0.9, 0.9, 0.25, C.metal, p.ref, o); // 引脚 1 标记
      o.faceColors = null;
      box(cx, cy, 0.9, 3.5, 3.5, 0.8, OFF_LED, p.ref, { ex:12, emissive:true });
      ledWindows.push({ mesh: MESHES[MESHES.length - 1], i, j });
    }
  }
}

/* 最小系统板：支持横放（USB 朝右）与竖放两种姿态 */
function buildBluePill(p){
  const horiz = !!p.horiz, cx = p.x, cy = p.y;
  const L = horiz ? p.w : p.d;          // 长边 53.3
  const S = horiz ? p.d : p.w;          // 短边 22.9
  const off = S / 2 - 2.54;             // 排母中心离板边 2.54 mm → 两排间距 = 短边 - 5.08 = 17.82 mm ≈ 7 个孔位
  const P = (a, b) => horiz ? [cx + a, cy + b] : [cx + b, cy + a];   // a 沿长边, b 沿短边
  const D = (l, s) => horiz ? [l, s] : [s, l];
  /* 两条 2×20 排母 */
  [-off, off].forEach(b => {
    const q = P(0, b), dd = D(L, 2.54);
    box(q[0], q[1], 0, dd[0], dd[1], 8.5, C.plastic, p.ref, { ex: 4 });
  });
  /* 模块 PCB */
  box(cx, cy, 8.5, p.w, p.d, 1.6, C.bluepill, p.ref, { ex: 9, faceColors: { bottom: C.bluepillEdge } });
  const put = (a, b, w, d, h, col) => {
    const q = P(a, b), dd = D(w, d);
    box(q[0], q[1], 10.1, dd[0], dd[1], h, col, p.ref, { ex: 15 });
  };
  put(0, 0, 7.0, 7.0, 1.4, C.chip);                 // STM32F103C8T6
  put(-L / 2 + 5.0, 0, 3.4, 3.0, 1.3, C.chip);      // AMS1117-3.3
  put(-L / 2 + 12.5, 0, 4.2, 3.0, 1.2, C.metal);    // 8 MHz 晶振
  put(L / 2 - 7.0, -2.2, 4.4, 4.4, 1.6, C.plastic); // 复位按键
  put(L / 2 - 3.7, 0, 7.7, 6.2, 2.9, C.metal);      // Micro-USB
  /* 排母焊脚（示意） */
  for (let i = 0; i < 20; i++){
    const a = -L / 2 + 1.27 + i * ((L - 2.54) / 19);
    [-off, off].forEach(b => {
      const q = P(a, b);
      box(q[0], q[1], 8.5, 0.5, 0.5, 0.2, C.gold, p.ref, { ex: 4 });
    });
  }
}

/* 独立灯阵板底板（70 × 70） */
function buildPanel(p){
  const cx = PANEL.x + PANEL.w / 2, cy = PANEL.y + PANEL.h / 2;
  box(cx, cy, -PANEL.t, PANEL.w, PANEL.h, PANEL.t, C.mask, p.ref, {
    ex: 0, faceColors: { top: C.mask, bottom: C.maskEdge, side: C.maskEdge }
  });
  box(cx, cy, -PANEL.t - 0.15, PANEL.w - 1.2, PANEL.h - 1.2, 0.10, C.copper, p.ref, { ex: 0 });
}

/* 主板 J5 → 灯阵板引出线 的 3 根杜邦线（二次贝塞尔曲线） */
function buildCable(p){
  const A = CABLE.from, B = CABLE.to, K = CABLE.ctl, N = 26;
  for (let i = 0; i <= N; i++){
    const t = i / N, u = 1 - t;
    const x = u*u*A[0] + 2*u*t*K[0] + t*t*B[0];
    const y = u*u*A[1] + 2*u*t*K[1] + t*t*B[1];
    const z = u*u*A[2] + 2*u*t*K[2] + t*t*B[2];
    const col = (i < 2 || i > N - 2) ? [0xf0,0xd0,0x40] : [0x2b,0x30,0x38];
    box(x, y, z, 2.2, 2.2, 1.9, col, p.ref, { ex: 2 });
  }
}

function buildButton(p){
  box(p.x, p.y, 0, 6.0, 6.0, 4.3, C.plastic, p.ref, { ex: 6 });
  cyl(p.x, p.y, 4.3, 'z', 1.0, 1.8, C.grey, p.ref, { ex: 12 });
  /* 6×6 轻触开关实际引脚栅格：横向 6.5 mm、纵向 4.5 mm */
  for (const sx of [-1, 1]) for (const sy of [-1, 1])
    box(p.x + sx * 3.25, p.y + sy * 2.25, 0, 0.8, 0.8, 4.5, C.metal, p.ref, { ex: 6 });
}

function buildJack(p){
  const w = 9, d = 12;
  box(p.x, p.y, 0, w, d, 10.5, C.black, p.ref, { ex: 6, faceColors: { top: [0x33,0x37,0x3d] } });
  cyl(p.x - w / 2 - 1.0, p.y, 5.2, 'x', 4.2, 3.0, C.metal, p.ref, { ex: 6 }, 20);
  cyl(p.x - w / 2 - 1.3, p.y, 5.2, 'x', 0.9, 1.5, C.hole, p.ref, { ex: 6 }, 16);
  box(p.x + w / 2 - 1.2, p.y, 0, 2.4, 4.0, 3.0, C.plastic, p.ref, { ex: 6 });
}

function buildSlide(p){
  box(p.x, p.y, 0, 8.7, 4.4, 3.0, C.plastic, p.ref, { ex: 6 });
  box(p.x + 1.2, p.y, 3.0, 2.2, 1.8, 2.2, C.grey, p.ref, { ex: 12 });
}

/* 板面尺寸刻度（丝印） */
function buildRuler(){
  for (let t = 5; t < BOARD.w; t += 5){
    const major = t % 10 === 0;
    box(t, 1.1, 0, 0.35, major ? 2.2 : 1.2, 0.06, C.silk, null, { ex: 0 });
    box(t, BOARD.h - 1.1, 0, 0.35, major ? 2.2 : 1.2, 0.06, C.silk, null, { ex: 0 });
  }
  for (let t = 5; t < BOARD.h; t += 5){
    const major = t % 10 === 0;
    box(1.1, t, 0, major ? 2.2 : 1.2, 0.35, 0.06, C.silk, null, { ex: 0 });
    box(BOARD.w - 1.1, t, 0, major ? 2.2 : 1.2, 0.35, 0.06, C.silk, null, { ex: 0 });
  }
  /* 灯阵板四边的尺寸刻度 */
  for (let t = 5; t < PANEL.w; t += 5){
    const major = t % 10 === 0;
    box(PANEL.x + t, PANEL.y + 1.1, 0, 0.35, major ? 2.2 : 1.2, 0.06, C.silk, null, { ex: 0 });
    box(PANEL.x + t, PANEL.y + PANEL.h - 1.1, 0, 0.35, major ? 2.2 : 1.2, 0.06, C.silk, null, { ex: 0 });
  }
}

/* ---------------- 直插件外形（全板零贴片） ---------------- */

/* 1/4W 金属膜直插电阻：本体 Ø2.3 × 6.3，引脚间距 4 个孔位（10.16 mm） */
function buildAxialRes(p){
  const BL = p.bodyL || 6.3, BR = p.bodyR || 1.15, LEAD = p.lead || 5.08;
  const Z = BR + 0.25;                       /* 本体离板面留一点缝，不穿板 */
  if (p.dir === 'y'){                        /* 竖放：两脚上下相距 4 个孔位 */
    cyl(p.x, p.y - BL / 2, Z, 'y', BL, BR, C.metalFilm, p.ref, { ex: 6 });
    cyl(p.x, p.y - LEAD, Z, 'y', LEAD - BL / 2, 0.28, C.metal, p.ref, { ex: 6 });
    cyl(p.x, p.y + BL / 2, Z, 'y', LEAD - BL / 2, 0.28, C.metal, p.ref, { ex: 6 });
    cyl(p.x, p.y - LEAD, 0, 'z', Z, 0.3, C.gold, p.ref, { ex: 6 });
    cyl(p.x, p.y + LEAD, 0, 'z', Z, 0.3, C.gold, p.ref, { ex: 6 });
    cyl(p.x, p.y - 1.35, Z + 0.01, 'y', 0.45, BR * 1.01, [0x3a,0x3a,0x40], p.ref, { ex: 6 });
    cyl(p.x, p.y - 0.55, Z + 0.01, 'y', 0.45, BR * 1.01, [0x3a,0x3a,0x40], p.ref, { ex: 6 });
    return;
  }
  cyl(p.x - BL / 2, p.y, Z, 'x', BL, BR, C.metalFilm, p.ref, { ex: 6 });
  cyl(p.x - LEAD, p.y, Z, 'x', LEAD - BL / 2, 0.28, C.metal, p.ref, { ex: 6 });
  cyl(p.x + BL / 2, p.y, Z, 'x', LEAD - BL / 2, 0.28, C.metal, p.ref, { ex: 6 });
  cyl(p.x - LEAD, p.y, 0, 'z', Z, 0.3, C.gold, p.ref, { ex: 6 });
  cyl(p.x + LEAD, p.y, 0, 'z', Z, 0.3, C.gold, p.ref, { ex: 6 });
  /* 色环（100 Ω：棕黑棕金；10 kΩ：棕黑橙金）只在中间加两道深色环，示意即可 */
  cyl(p.x - 1.35, p.y, Z + 0.01, 'x', 0.45, BR * 1.01, [0x3a,0x3a,0x40], p.ref, { ex: 6 });
  cyl(p.x - 0.55, p.y, Z + 0.01, 'x', 0.45, BR * 1.01, [0x3a,0x3a,0x40], p.ref, { ex: 6 });
}

/* 直插瓷片电容：圆片竖立，Ø5.2，引脚间距 1 个孔位（2.54 mm） */
function buildDiscCap(p){
  (p.subs || [{ x:p.x, y:p.y }]).forEach(q => {
    cyl(q.x, q.y - 1.15, 2.9, 'y', 2.3, 2.6, C.disc, p.ref, { ex: 6 }, 22);
    cyl(q.x, q.y + 1.15, 2.9, 'y', 0.12, 2.3, C.discTop, p.ref, { ex: 12 }, 22);
    for (const dx of [-1.27, 1.27]){
      cyl(q.x + dx, q.y, 0, 'z', 2.9, 0.26, C.metal, p.ref, { ex: 6 });
      cyl(q.x + dx, q.y, 0, 'z', 0.35, 0.5, C.gold, p.ref, { ex: 6 });
    }
  });
}

/* 直插独石电容：黄色小方块，引脚间距 1 个孔位（2.54 mm） */
function buildMonoCap(p){
  (p.subs || [{ x:p.x, y:p.y }]).forEach(q => {
    box(q.x, q.y, 0.5, 4.4, 4.0, 3.4, C.mono, p.ref, { ex: 6 });
    box(q.x, q.y, 3.9, 4.6, 4.2, 0.35, C.monoTop, p.ref, { ex: 12 });
    for (const dx of [-1.27, 1.27]){
      cyl(q.x + dx, q.y, 0, 'z', 0.5, 0.26, C.metal, p.ref, { ex: 6 });
      cyl(q.x + dx, q.y, 0, 'z', 0.3, 0.5, C.gold, p.ref, { ex: 6 });
    }
  });
}

/* 小电解电容（10 µF 直插）：Ø5 × 11，引脚间距 1 个孔位（2.54 mm） */
function buildECapSmall(p){
  (p.subs || [{ x:p.x, y:p.y }]).forEach(q => {
    /* back=true：焊在灯阵板背面（灯阵板正面要放灯珠，放不下） */
    const z0 = p.back ? -1.3 : 0.6, dir = p.back ? -1 : 1;
    const zt = z0 + dir * 10.2;
    cyl(q.x, q.y, Math.min(z0, zt), 'z', 10.2, 2.5, C.capBulk, p.ref, { ex: 7 }, 20);
    cyl(q.x, q.y, p.back ? zt - 0.35 : zt, 'z', 0.3, 2.45, C.metal, p.ref, { ex: 14 }, 20);
    box(q.x - 2.45, q.y, Math.min(z0, zt), 0.8, 3.0, 10.2, C.grey, p.ref, { ex: 7 });
    box(q.x, q.y, p.back ? zt - 0.42 : zt + 0.3, 2.6, 0.35, 0.07, C.grey, p.ref, { ex: 14 });
    box(q.x, q.y, p.back ? zt - 0.42 : zt + 0.3, 0.35, 2.6, 0.07, C.grey, p.ref, { ex: 14 });
    for (const dx of [-1.27, 1.27]){
      cyl(q.x + dx, q.y, p.back ? 0 : 0, 'z', Math.abs(z0), 0.28, C.metal, p.ref, { ex: 6 });
      cyl(q.x + dx, q.y, 0, 'z', 0.4, 0.55, C.gold, p.ref, { ex: 6 });
    }
  });
}

/* DIP-8 直插运放：本体 9.6 × 6.6，两排引脚间距 7.62 mm（3 个孔位） */
function buildDIP8(p){
  const bw = 9.6, bd = 6.6;
  box(p.x, p.y, 1.25, bw, bd, 3.1, C.chip, p.ref, { ex: 7 });
  box(p.x, p.y, 4.35, bw - 1.0, bd - 1.0, 0.28, [0x22,0x25,0x2a], p.ref, { ex: 13 });
  cyl(p.x - 3.0, p.y, 4.6, 'z', 0.06, 0.62, C.grey, p.ref, { ex: 13 }, 14);      /* 1 脚凹点 */
  cyl(p.x + 3.0, p.y, 4.6, 'z', 0.06, 0.62, C.grey, p.ref, { ex: 13 }, 14);
  for (let i = 0; i < 4; i++){
    const dx = -3.81 + i * 2.54;
    for (const dy of [-3.81, 3.81]){
      box(p.x + dx, p.y + dy, 0, 0.62, 1.5, 1.3, C.metal, p.ref, { ex: 7 });
      box(p.x + dx, p.y + dy + Math.sign(dy) * 0.75, 1.3, 0.62, 0.6, 0.35, C.gold, p.ref, { ex: 7 });
    }
  }
}

/* 直插二极管：dir 'x' 横放（1N5408）/ 'y' 竖放（1N4148） */
function buildAxialDiode(p){
  const BL = p.bodyL || 4.0, BR = p.bodyR || 0.95, LEAD = p.lead || 2.54;
  const Z = BR + 0.25;                       /* 1N5408 本体较粗，抬高一点避免穿板 */
  const horiz = p.dir !== 'y';
  (p.subs || [{ x:p.x, y:p.y }]).forEach(q => {
    if (horiz){
      cyl(q.x - LEAD, q.y, Z, 'x', 2 * LEAD, 0.3, C.metal, p.ref, { ex: 6 });
      cyl(q.x - BL / 2, q.y, Z, 'x', BL, BR, C.chip, p.ref, { ex: 6 });
      cyl(q.x + BL / 2 - 0.5, q.y, Z + 0.01, 'x', 0.5, BR * 1.02, C.grey, p.ref, { ex: 11 });
    } else {
      cyl(q.x, q.y - LEAD, Z, 'y', 2 * LEAD, 0.3, C.metal, p.ref, { ex: 6 });
      cyl(q.x, q.y - BL / 2, Z, 'y', BL, BR, C.chip, p.ref, { ex: 6 });
      cyl(q.x, q.y + BL / 2 - 0.5, Z + 0.01, 'y', 0.5, BR * 1.02, C.grey, p.ref, { ex: 11 });
    }
  });
}

/* 旧版螺钉端子画法：现方案改成「剥皮短线直接焊在两孔焊盘上」，此函数不再调用 */
function buildScrew2P(p){
  const w = 10.16, d = 10.0, h = 9.5;
  box(p.x, p.y, 0, w, d, h, C.term, p.ref, { ex: 6, faceColors: { top: C.termTop, bottom: C.termTop } });
  for (const dx of [-2.54, 2.54]){
    cyl(p.x + dx, p.y - 1.1, h - 0.4, 'z', 0.5, 2.15, [0xd6,0xda,0xde], p.ref, { ex: 14 }, 18);
    cyl(p.x + dx, p.y - 1.1, h + 0.1, 'z', 0.35, 0.85, C.hole, p.ref, { ex: 14 }, 12);
    cyl(p.x + dx, p.y - 1.1, h + 0.45, 'z', 0.06, 1.9, [0xa8,0xae,0xb6], p.ref, { ex: 14 }, 18);
    box(p.x + dx, p.y + d / 2 - 0.6, 2.4, 2.6, 2.6, 2.6, C.hole, p.ref, { ex: 6 });
    box(p.x + dx, p.y + d / 2 - 3.6, 0, 0.9, 0.9, 2.4, C.gold, p.ref, { ex: 6 });
  }
}

/* 蓝牙串口模块：竖插在 J8（1×4 排母）上，卡片【竖着立】——长边朝上、转 90°
   —— 板面只占 «13.2 × 3 mm» 一条，立高约 26.9 mm，天线在卡片顶端 */
function buildBTStand(p){
  const cx = p.x, cy = p.y;
  const W = p.d || 13.2;          // 沿板面的宽度（短边）
  const T = 1.6;                  // 模块 PCB 厚度
  const H = p.w || 26.9;          // 立起来的高度（长边）
  const z0 = 8.5;                 // 坐在 1×4 排母（J8）上，引脚插进排母里（不画出来）
  if (p.rot90){                   /* 卡片侧身立：平面在 y–z 平面，板面只占 3 × 13.2 */
    box(cx, cy, z0, T, W, H, C.btg, p.ref, { ex: 9 });
    box(cx + T / 2 + 0.7, cy - 1.2, z0 + 5.6, 1.4, 6.4, 4.8, C.chip, p.ref, { ex: 16 });
    box(cx + T / 2 + 0.6, cy + 3.4, z0 + 3.2, 1.2, 2.6, 2.2, C.chip, p.ref, { ex: 16 });
    for (let i = 0; i < 3; i++)
      box(cx + T / 2 + 0.5, cy - 2.0 + i * 2.0, z0 + H - 8.4, 1.0, 1.2, 7.2, C.gold, p.ref, { ex: 16 });
    const n = p.pins || 4;
    for (let i = 0; i < n; i++)
      box(cx, cy - (n - 1) * 1.27 + i * 2.54, 0, 0.62, 0.62, z0, C.gold, p.ref, { ex: 4 });
    box(cx + T / 2 + 0.5, cy - (n - 1) * 1.27, z0 + 1.0, 0.8, 0.8, 0.8, C.silk, p.ref, { ex: 16 });
    return;
  }
  const face = cy + T / 2;        // 元件面朝板子下边缘（+y）一侧
  /* 模块 PCB（竖立，窄而高） */
  box(cx, cy, z0, W, T, H, C.btg, p.ref, { ex: 9 });
  /* 板载元件（卡片中部偏下） */
  box(cx - 1.2, face + 0.7, z0 + 5.6, 6.4, 1.4, 4.8, C.chip, p.ref, { ex: 16 });   // 主芯片
  box(cx + 3.4, face + 0.6, z0 + 3.2, 2.6, 1.2, 2.2, C.chip, p.ref, { ex: 16 });   // 辅芯片
  /* 板载天线（卡片顶端，远离排母） */
  for (let i = 0; i < 3; i++)
    box(cx - 2.0 + i * 2.0, face + 0.5, z0 + H - 8.4, 1.2, 1.0, 7.2, C.gold, p.ref, { ex: 16 });
  /* 4 个引脚：居中落在 J8 的 4 个孔上（列 28–31） */
  for (let i = 0; i < 4; i++)
    box(cx - 3.81 + i * 2.54, cy, 0, 0.62, 0.62, z0, C.gold, p.ref, { ex: 4 });
  /* 脚位序号丝印块 */
  box(cx - 3.81, face - 0.5, z0 + 1.0, 0.8, 0.8, 0.8, C.silk, p.ref, { ex: 16 });
}

/* 1×4 排母（母座）：4 个方孔，模块竖插在上面 */
function buildSocket4(p){
  const n = 4, L = n * 2.54;
  box(p.x, p.y, 0, L, 2.54, 8.5, C.plastic, p.ref,
      { ex: 4, faceColors: { top: [0x34,0x39,0x41], bottom: [0x1b,0x1e,0x23] } });
  for (let i = 0; i < n; i++){
    const px = p.x + (i - (n - 1) / 2) * 2.54;
    box(px, p.y, 8.5, 1.15, 1.15, 0.6, C.hole, p.ref, { ex: 14 });   // 插孔
    box(px, p.y - 1.05, 6.6, 0.5, 0.5, 1.4, C.gold, p.ref, { ex: 14 });
    box(px, p.y + 1.05, 6.6, 0.5, 0.5, 1.4, C.gold, p.ref, { ex: 14 });   // 侧面看到的簧片
  }
}

/* 1×4 排母竖放：4 个孔沿 y 方向排（转 90°） */
function buildSocket4V(p){
  const n = p.pins || 4, L = n * 2.54;
  box(p.x, p.y, 0, 2.54, L, 8.5, C.plastic, p.ref,
      { ex: 4, faceColors: { top: [0x34,0x39,0x41], bottom: [0x1b,0x1e,0x23] } });
  for (let i = 0; i < n; i++){
    const py = p.y + (i - (n - 1) / 2) * 2.54;
    box(p.x, py, 8.5, 1.15, 1.15, 0.6, C.hole, p.ref, { ex: 14 });
    box(p.x - 1.05, py, 6.6, 0.5, 0.5, 1.4, C.gold, p.ref, { ex: 14 });
    box(p.x + 1.05, py, 6.6, 0.5, 0.5, 1.4, C.gold, p.ref, { ex: 14 });
  }
}


/* 电源输入焊盘：2 个焊接孔 + 2 个应力释放孔（剥皮短线直接焊进去） */
function buildSolderPad2(p){
  for (const dx of [-2.54, 2.54]){
    cyl(p.x + dx, p.y, 0, 'z', 0.12, 1.6, C.gold, p.ref, { ex: 3 }, 18);
    cyl(p.x + dx, p.y, 0.12, 'z', 0.06, 0.7, C.hole, p.ref, { ex: 3 }, 12);
  }
  for (const dx of [-2.54, 2.54])
    cyl(p.x + dx, p.y + 5.08, 0, 'z', 0.1, 1.3, C.gold, p.ref, { ex: 3 }, 16);
  box(p.x, p.y, 0.1, 3.0, 0.7, 0.25, C.silk, p.ref, { ex: 3 });
}

/* 大电解电容 470µF/16V：Ø10 × 12.5，脚距 5 mm（≈2 个孔位，直接落孔） */
function buildECapBig(p){
  const R = 5.0, H = 10.5;
  cyl(p.x, p.y, 0.5, 'z', H, R, C.capBulk, p.ref, { ex: 7 }, 24);
  cyl(p.x, p.y, H + 0.5, 'z', 0.25, R - 0.1, C.metal, p.ref, { ex: 14 }, 24);
  box(p.x - R + 0.4, p.y, 0.5, 0.9, 4.6, H + 0.1, C.grey, p.ref, { ex: 7 });      // 极性标记
  box(p.x, p.y, H + 0.8, 7.0, 0.6, 0.08, C.grey, p.ref, { ex: 14 });              // 顶部防爆纹
  box(p.x, p.y, H + 0.8, 0.6, 7.0, 0.08, C.grey, p.ref, { ex: 14 });
  for (const dx of [-2.54, 2.54]){
    cyl(p.x + dx, p.y, 0, 'z', 0.5, 0.3, C.metal, p.ref, { ex: 6 });
    cyl(p.x + dx, p.y, 0, 'z', 0.4, 0.55, C.gold, p.ref, { ex: 6 });
  }
}

function buildScene(){
  /* 主板：顶面绿油、侧面深绿 */
  box(BOARD.w / 2, BOARD.h / 2, -BOARD.t, BOARD.w, BOARD.h, BOARD.t, C.mask, null, {
    ex: 0, faceColors: { top: C.mask, bottom: C.maskEdge, side: C.maskEdge }
  });
  /* 底层铺铜 */
  box(BOARD.w / 2, BOARD.h / 2, -BOARD.t - 0.15, BOARD.w - 1.2, BOARD.h - 1.2, 0.10, C.copper, null, { ex: 0 });

  PARTS.forEach(p => {
    switch (p.kind){
      case 'ledarray': buildLEDArray(p); break;
      case 'bluepill': buildBluePill(p); break;
      case 'btmodule': buildBTStand(p); break;
      case 'button':   buildButton(p); break;
      case 'jack':     buildJack(p); break;
      case 'dip8':     buildDIP8(p); break;
      case 'axialres': buildAxialRes(p); break;
      case 'diode':    buildAxialDiode(p); break;
      case 'diode35':  buildAxialDiode(p); break;
      case 'disccap':  buildDiscCap(p); break;
      case 'monocap':  buildMonoCap(p); break;
      case 'ecapsmall':buildECapSmall(p); break;
      case 'ecap':     buildECapBig(p); break;
      case 'slide':    buildSlide(p); break;
      case 'screw2p':  buildScrew2P(p); break;
      case 'solderpad2':buildSolderPad2(p); break;
      case 'header1x2':header(p.x, p.y, 2, 'x', p.ref, { ex: 4 }); break;
      case 'header1x2v':header(p.x, p.y, 2, 'y', p.ref, { ex: 4 }); break;
      case 'header1x3':header(p.x, p.y, 3, 'x', p.ref, { ex: 4 }); break;
      case 'header1x4':header(p.x, p.y, 4, 'x', p.ref, { ex: 4 }); break;
      case 'socket1x4':buildSocket4(p); break;
      case 'socket4x1':buildSocket4V(p); break;
      case 'panelpcb': buildPanel(p); break;
      case 'cable':    buildCable(p); break;
    }
  });

  /* 计算每个元件的标注锚点（网格包围盒顶部中心） */
  const acc = new Map();
  MESHES.forEach(m => {
    if (!m.ref) return;
    let a = acc.get(m.ref);
    if (!a) a = { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity, z1: -Infinity, n: 0 };
    const v = m.v;
    for (let i = 0; i < v.length; i += 3){
      a.x0 = Math.min(a.x0, v[i]); a.x1 = Math.max(a.x1, v[i]);
      a.y0 = Math.min(a.y0, v[i + 1]); a.y1 = Math.max(a.y1, v[i + 1]);
      a.z1 = Math.max(a.z1, v[i + 2]);
    }
    a.n++;
    acc.set(m.ref, a);
  });
  acc.forEach((a, ref) => {
    const p = PART_BY_REF.get(ref);
    if (!p) return;
    p.anchor = [(a.x0 + a.x1) / 2, (a.y0 + a.y1) / 2, a.z1];
    /* 顺便记下布局坐标下的外框，用来换算洞洞板孔位 */
    p.bb = {
      x0: a.x0 + BOARD.w / 2, x1: a.x1 + BOARD.w / 2,
      y0: BOARD.h / 2 - a.y1, y1: BOARD.h / 2 - a.y0
    };
  });
}
/*__PART_RENDER__*/
/* =======================================================================
   3. 渲染：自写软件 3D 渲染器（Z-Buffer 光栅化），无外部依赖
   ======================================================================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

let VW = 0, VH = 0, RW = 0, RH = 0, Kp = 1, fpx = 1;
let img = null, data = null, bgData = null, zBuf = null, idBuf = null;

const cam = { az: -2.10, pitch: 0.50, dist: 232, tx: 0, ty: 0, tz: 4, fov: 32 * Math.PI / 180 };
const camT = Object.assign({}, cam);
let basis = { xa:[1,0,0], ya:[0,1,0], za:[0,0,1], eye:[0,0,0] };

const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = v => { const l = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];

const L1 = norm([-0.44, -0.58, 0.72]);
const L2 = norm([0.66, 0.40, 0.30]);

/* ---------- 尺寸与缓冲 ---------- */
function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  const touchy = (typeof navigator !== 'undefined') && (navigator.maxTouchPoints || 0) > 0;
  const dpr = Math.min(window.devicePixelRatio || 1, touchy ? 1.3 : 1.6);
  VW = Math.max(320, Math.round(r.width * dpr));
  VH = Math.max(260, Math.round(r.height * dpr));
  cv.width = VW; cv.height = VH;
  Kp = VW / Math.max(1, r.width);

  const maxPix = touchy ? 0.85e6 : 2.0e6;   // 手机上降低渲染分辨率，保证流畅
  const scale = Math.min(1, Math.sqrt(maxPix / (VW * VH)));
  RW = Math.max(240, Math.round(VW * scale));
  RH = Math.max(200, Math.round(VH * scale));
  off.width = RW; off.height = RH;

  img = octx.createImageData(RW, RH);
  data = img.data;
  zBuf = new Float32Array(RW * RH);
  idBuf = new Int32Array(RW * RH);

  /* 背景：中心微亮的深色渐变（先烧进像素，避免逐帧重绘渐变） */
  bgData = new Uint8ClampedArray(data.length);
  const tmp = document.createElement('canvas'); tmp.width = RW; tmp.height = RH;
  const tctx = tmp.getContext('2d');
  const g = tctx.createLinearGradient(0, 0, RW * 0.5, RH);
  g.addColorStop(0, '#1a2331');
  g.addColorStop(0.55, '#111823');
  g.addColorStop(1, '#0a0e14');
  tctx.fillStyle = g; tctx.fillRect(0, 0, RW, RH);
  const rd = tctx.getImageData(0, 0, RW, RH).data;
  for (let i = 0; i < RW * RH; i++){
    const x = i % RW, y = (i / RW) | 0;
    const d = Math.hypot((x - RW * 0.46) / RW, (y - RH * 0.5) / RH);
    const glow = Math.max(0, 1 - d * 2.1) * 16;
    bgData[i*4]   = Math.min(255, rd[i*4]   + glow);
    bgData[i*4+1] = Math.min(255, rd[i*4+1] + glow * 1.05);
    bgData[i*4+2] = Math.min(255, rd[i*4+2] + glow * 1.2);
    bgData[i*4+3] = 255;
  }
}

/* ---------- 相机 ---------- */
function updateBasis(){
  const p = cam.pitch, a = cam.az;
  const za = norm([Math.sin(p)*Math.cos(a), Math.sin(p)*Math.sin(a), Math.cos(p)]);
  const eye = [cam.tx + cam.dist*za[0], cam.ty + cam.dist*za[1], cam.tz + cam.dist*za[2]];
  let xa = cross([0,0,1], za);
  if (Math.hypot(xa[0],xa[1],xa[2]) < 1e-5) xa = [1,0,0]; else xa = norm(xa);
  const ya = cross(za, xa);
  basis = { xa, ya, za, eye };
  fpx = (RH / 2) / Math.tan(cam.fov / 2);
}

/* 世界坐标 → 屏幕（主画布像素） */
function project(p){
  const d = [p[0]-basis.eye[0], p[1]-basis.eye[1], p[2]-basis.eye[2]];
  const depth = -(d[0]*basis.za[0] + d[1]*basis.za[1] + d[2]*basis.za[2]);
  if (depth <= 0.6) return null;
  const xc = d[0]*basis.xa[0] + d[1]*basis.xa[1] + d[2]*basis.xa[2];
  const yc = d[0]*basis.ya[0] + d[1]*basis.ya[1] + d[2]*basis.ya[2];
  const k = VW / RW;
  return { x: (RW/2 + fpx*xc/depth) * k, y: (RH/2 - fpx*yc/depth) * k, d: depth };
}

/* ---------- 面法线与重心 ---------- */
function computeNormals(){
  MESHES.forEach(m => {
    const nf = m.f.length;
    m.n = new Float32Array(nf * 3);
    m.c = new Float32Array(nf * 3);
    for (let fi = 0; fi < nf; fi++){
      const f = m.f[fi], v = m.v;
      const a = f[0]*3, b = f[1]*3, c = f[2]*3;
      const e1 = [v[b]-v[a], v[b+1]-v[a+1], v[b+2]-v[a+2]];
      const e2 = [v[c]-v[a], v[c+1]-v[a+1], v[c+2]-v[a+2]];
      const n = norm(cross(e1, e2));
      m.n[fi*3] = n[0]; m.n[fi*3+1] = n[1]; m.n[fi*3+2] = n[2];
      let cx = 0, cy = 0, cz = 0;
      for (const id of f){ cx += v[id*3]; cy += v[id*3+1]; cz += v[id*3+2]; }
      const k = f.length;
      m.c[fi*3] = cx/k; m.c[fi*3+1] = cy/k; m.c[fi*3+2] = cz/k;
    }
  });
}

/* ---------- 光栅化 ---------- */
let CUR_PI = -1, CUR_R = 0, CUR_G = 0, CUR_B = 0;

function rasterTri(x0,y0,iz0, x1,y1,iz1, x2,y2,iz2){
  const minx = Math.max(0, Math.floor(Math.min(x0,x1,x2)));
  const maxx = Math.min(RW-1, Math.ceil(Math.max(x0,x1,x2)));
  const miny = Math.max(0, Math.floor(Math.min(y0,y1,y2)));
  const maxy = Math.min(RH-1, Math.ceil(Math.max(y0,y1,y2)));
  if (minx > maxx || miny > maxy) return;
  const area = (x1-x0)*(y2-y0) - (x2-x0)*(y1-y0);
  if (Math.abs(area) < 1e-9) return;
  const ia = 1 / area;
  const r = CUR_R, g = CUR_G, b = CUR_B, pi = CUR_PI;
  for (let y = miny; y <= maxy; y++){
    const py = y + 0.5;
    const row = y * RW;
    for (let x = minx; x <= maxx; x++){
      const px = x + 0.5;
      const w0 = ((x1-x0)*(py-y0) - (px-x0)*(y1-y0)) * ia;
      if (w0 < 0) continue;
      const w1 = ((x2-x1)*(py-y1) - (px-x1)*(y2-y1)) * ia;
      if (w1 < 0) continue;
      const w2 = 1 - w0 - w1;
      if (w2 < 0) continue;
      /* 重心坐标：w0 对应顶点 C，w1 对应顶点 A，w2 对应顶点 B */
      const iz = w1*iz0 + w2*iz1 + w0*iz2;
      const idx = row + x;
      if (iz > zBuf[idx]){
        zBuf[idx] = iz;
        idBuf[idx] = pi;
        const o = idx * 4;
        data[o] = r; data[o+1] = g; data[o+2] = b; data[o+3] = 255;
      }
    }
  }
}

/* ---------- 每帧绘制 ---------- */
let vbuf = null;

function draw3D(explodeK, hoverPi, selPi){
  data.set(bgData);
  zBuf.fill(-1);
  if (hoverPi >= 0 || selPi >= 0) idBuf.fill(-1); else idBuf.fill(-1);

  const eye = basis.eye;
  const cx0 = RW/2, cy0 = RH/2;

  for (let mi = 0; mi < MESHES.length; mi++){
    const m = MESHES[mi];
    if (!showPanel && m.ref && PANEL_REFS.has(m.ref)) continue;
    const v = m.v, nv = v.length / 3;
    if (!vbuf || vbuf.length < nv * 4) vbuf = new Float32Array(nv * 8);
    const dz = m.ex * explodeK;
    for (let i = 0; i < nv; i++){
      const d = [v[i*3]-eye[0], v[i*3+1]-eye[1], v[i*3+2]+dz-eye[2]];
      const depth = -(d[0]*basis.za[0] + d[1]*basis.za[1] + d[2]*basis.za[2]);
      const xc = d[0]*basis.xa[0] + d[1]*basis.xa[1] + d[2]*basis.xa[2];
      const yc = d[0]*basis.ya[0] + d[1]*basis.ya[1] + d[2]*basis.ya[2];
      const o = i*4;
      if (depth <= 0.6){ vbuf[o+3] = -1; continue; }
      vbuf[o]   = cx0 + fpx*xc/depth;
      vbuf[o+1] = cy0 - fpx*yc/depth;
      vbuf[o+2] = 1/depth;
      vbuf[o+3] = depth;
    }
    const base = m.color;
    const isSel = (m.pi >= 0 && m.pi === selPi);
    const isHov = (m.pi >= 0 && m.pi === hoverPi);
    for (let fi = 0; fi < m.f.length; fi++){
      const f = m.f[fi];
      let ok = true;
      for (let k = 0; k < f.length; k++) if (vbuf[f[k]*4+3] < 0) { ok = false; break; }
      if (!ok) continue;
      let nx = m.n[fi*3], ny = m.n[fi*3+1], nz = m.n[fi*3+2];
      const cxw = m.c[fi*3], cyw = m.c[fi*3+1], czw = m.c[fi*3+2] + dz;
      if ((eye[0]-cxw)*nx + (eye[1]-cyw)*ny + (eye[2]-czw)*nz < 0) continue;   /* 背面剔除 */
      let r, g, b;
      if (m.emissive){
        r = base[0]; g = base[1]; b = base[2];
        r *= 0.88; g *= 0.88; b *= 0.88;
      } else {
        const d1 = Math.max(0, nx*L1[0] + ny*L1[1] + nz*L1[2]);
        const d2 = Math.max(0, nx*L2[0] + ny*L2[1] + nz*L2[2]);
        const bounce = Math.max(0, -nz) * 0.14;
        const kk = 0.32 + 0.62*d1 + 0.20*d2 + bounce;
        const fc = m.fc ? (fi === 0 ? m.fc.top : (fi === 1 ? m.fc.bottom : m.fc.side)) : null;
        const cc = fc || base;
        r = cc[0]*kk; g = cc[1]*kk; b = cc[2]*kk;
      }
      if (isSel){ r = r*0.76 + 120*0.24; g = g*0.76 + 226*0.24; b = b*0.76 + 255*0.24; }
      else if (isHov){ r = r*0.88 + 90*0.12; g = g*0.88 + 210*0.12; b = b*0.88 + 230*0.12; }
      CUR_PI = m.pi === undefined ? -1 : m.pi;
      CUR_R = Math.min(255, r) | 0; CUR_G = Math.min(255, g) | 0; CUR_B = Math.min(255, b) | 0;
      if (f.length === 4){
        const a = f[0]*4, bb = f[1]*4, c = f[2]*4, d = f[3]*4;
        rasterTri(vbuf[a],vbuf[a+1],vbuf[a+2], vbuf[bb],vbuf[bb+1],vbuf[bb+2], vbuf[c],vbuf[c+1],vbuf[c+2]);

/* 入参用布局坐标（x 向右 0..W，y 向下 0..H），原点转成板左下角后取整到孔号 */
function holeOfPoint(x, y, isPanel){
  const W = isPanel ? PANEL.w : BOARD.w, H = isPanel ? PANEL.h : BOARD.h;
  const ox = isPanel ? PANEL.x : 0, oy = isPanel ? PANEL.y : 0;
  const c = Math.round((x - ox - HOLE0) / HOLE) + 1;      // 列：从左往右
  const r = Math.round((H - (y - oy) - HOLE0) / HOLE) + 1; // 行：从下往上
  return {
    c: Math.max(1, Math.min(holeCols(W), c)),
    r: Math.max(1, Math.min(holeRows(H), r))
  };
}
function holeRange(p){
  const isPanel = p.zone === 'M';
  const W = isPanel ? PANEL.w : BOARD.w, H = isPanel ? PANEL.h : BOARD.h;
  const ox = isPanel ? PANEL.x : 0, oy = isPanel ? PANEL.y : 0;
  if (p.subs){   /* 多实例元件：逐个给孔位 */
    const list = p.subs.map(s => holeOfPoint(s.x, s.y, isPanel));
    return { multi:true, list };
  }
  const bb = p.bb;
  if (!bb) return null;
  const a = holeOfPoint(bb.x0, bb.y1, isPanel);   // 左下角
  const b = holeOfPoint(bb.x1, bb.y0, isPanel);   // 右上角
  return {
    c0: Math.min(a.c, b.c), c1: Math.max(a.c, b.c),
    r0: Math.min(a.r, b.r), r1: Math.max(a.r, b.r),
    cols: holeCols(W), rows: holeRows(H)
  };
}
function holeText(p){
  if (p.holes) return p.holes;          /* 立起来 / 不落孔的元件用文字说明 */
  const h = holeRange(p);
  if (!h) return '—';
  if (h.multi) return h.list.map(o => '列' + o.c + '行' + o.r).join('、');
  return '列 ' + h.c0 + '–' + h.c1 + ' · 行 ' + h.r0 + '–' + h.r1;
}
function holeAreaText(p){
  const h = holeRange(p);
  if (!h || h.multi) return '';
  return '（占 ' + (h.c1 - h.c0 + 1) + ' × ' + (h.r1 - h.r0 + 1) + ' 孔位）';
}

let SCENE_BOX = null;
function computeSceneBox(){
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, z0 = 1e9, z1 = -1e9;
  MESHES.forEach(m => {
    if (!showPanel && m.ref && PANEL_REFS.has(m.ref)) return;
    const v = m.v;
    for (let i = 0; i < v.length; i += 3){
      if (v[i] < x0) x0 = v[i]; if (v[i] > x1) x1 = v[i];
      if (v[i+1] < y0) y0 = v[i+1]; if (v[i+1] > y1) y1 = v[i+1];
      if (v[i+2] < z0) z0 = v[i+2]; if (v[i+2] > z1) z1 = v[i+2];
    }
  });
  SCENE_BOX = { x0, x1, y0, y1, z0, z1 };
}
function fitCamera(){
  computeSceneBox();
  cam.tx = camT.tx = (SCENE_BOX.x0 + SCENE_BOX.x1) / 2;
  cam.ty = camT.ty = (SCENE_BOX.y0 + SCENE_BOX.y1) / 2;
  cam.tz = camT.tz = (SCENE_BOX.z0 + SCENE_BOX.z1) / 2 + 2;
  cam.dist = camT.dist = 300;
  updateBasis();
  const B = SCENE_BOX, pts = [];
  for (const X of [B.x0, B.x1]) for (const Y of [B.y0, B.y1]) for (const Z of [B.z0 - 6, B.z1 + 6]) pts.push([X, Y, Z]);
  let m = 0;
  pts.forEach(p => {
    const s = project(p);
    if (!s) return;
    m = Math.max(m, Math.abs(s.x - VW / 2) / (VW / 2), Math.abs(s.y - VH / 2) / (VH / 2));
  });
  cam.dist = camT.dist = Math.max(70, Math.min(900, 300 * m * 1.14));
}

function hsv(h, s, v){
  const i = Math.floor(h*6), f = h*6-i, p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
  const r = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6];
  return [r[0]*255, r[1]*255, r[2]*255];
}

function ledColor(kind, t, i, j){
  const b = i => BITS[i];
  switch (kind){
    case 'red':   return [255,28,28];
    case 'green': return [0,230,96];
    case 'blue':  return [46,96,255];
    case 'off':   return OFF_LED;
    case 'heart': { const on = b('heart')[j][i] === '1';
      const br = 0.34 + 0.66 * (0.5 + 0.5*Math.sin(t*2.2));
      return on ? [255*br, 34*br, 210*br] : OFF_LED; }
    case 'smile': return b('smile')[j][i] === '1' ? [255,205,0] : OFF_LED;
    case 'arrow': { const sh = Math.floor(t*3.2) % 11 - 2, c = i - sh;
      return (c >= 0 && c < 8 && b('arrow')[j][c] === '1') ? [0,225,255] : OFF_LED; }
    case 'fft': { const h = [3,4,6,8,7,5,3,2][i];
      return ((7-j) < h) ? hsv(i/8*0.78, 0.75, 1) : OFF_LED; }
    case 'waterfall': {
      const tau = t - j * 0.24;                      // 每行是稍早一帧的频谱，形成瀑布
      const amp = [3,4,6,8,7,5,3,2][i] / 8;
      const v = amp * (0.55 + 0.45 * Math.sin(tau * 3.1 + i * 0.8));
      return v > 0.26 ? hsv(i / 8 * 0.78, 0.85, Math.min(1, v * 1.7)) : OFF_LED;
    }
    case 'demo': {
      const T = t % 18;
      if (T < 1) return [255,28,28];
      if (T < 2) return [0,230,96];
      if (T < 3) return [46,96,255];
      if (T < 8) return ledColor('heart', T-3, i, j);
      if (T < 13) return ledColor('arrow', T-8, i, j);
      if (T < 16){ const h = Math.max(1, Math.round(([3,4,6,8,7,5,3,2][i]) * (0.6 + 0.55*Math.sin(t*3 + i))));
        return ((7-j) < h) ? hsv(i/8*0.78, 0.75, 1) : OFF_LED; }
      return ledColor('smile', 0, i, j);
    }
  }
  return OFF_LED;
}

function paintLEDs(now){

}

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* 在板面上按板面方向绘制文字 */
function planeText(lx, ly, str, sizeMM, color, align){
  const p0 = project(W3(lx, ly, 0.12));
  const p1 = project(W3(lx + 5, ly, 0.12));
  const p2 = project(W3(lx, ly + 5, 0.12));
  if (!p0 || !p1 || !p2) return;
  const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
  const scale = Math.hypot(p1.x - p0.x, p1.y - p0.y) / 5;
  ctx.save();
  ctx.translate(p0.x, p0.y);
  ctx.rotate(ang);
  ctx.font = '600 ' + Math.max(7, sizeMM * scale).toFixed(1) + 'px "Microsoft YaHei",system-ui,sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = align || 'left';
  ctx.fillStyle = color;
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

      if (isWire){
        ctx.setLineDash([7 * Kp, 5 * Kp]);
        ctx.strokeStyle = 'rgba(120,178,228,0.9)';
        ctx.lineWidth = 1.7 * Kp;
      } else {
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(255,190,60,0.95)';
        ctx.lineWidth = 3.4 * Kp;
      }
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(e.x, e.y); ctx.stroke();
      ctx.setLineDash([]);
      [a, e].forEach(q => {
        ctx.beginPath(); ctx.arc(q.x, q.y, 2.8 * Kp, 0, 6.2832);
        ctx.fillStyle = isWire ? 'rgba(120,178,228,0.95)' : 'rgba(255,205,90,0.98)';
        ctx.fill();
      });
      if (b.n && Math.hypot(e.x - a.x, e.y - a.y) > 30 * Kp){
        ctx.font = '600 ' + tiny + 'px "Microsoft YaHei",system-ui,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = isWire ? 'rgba(150,198,238,0.95)' : 'rgba(255,214,110,0.98)';
        ctx.fillText(b.n, (a.x + e.x) / 2, (a.y + e.y) / 2 - 9 * Kp);
      }
      ctx.restore();
    });
  }
  if (below){
    const c = project(W3(BOARD.w / 2, BOARD.h / 2, -1.9));
    if (c){
      ctx.font = '600 ' + small + 'px "Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(230,180,110,0.95)';
      ctx.fillText('主板底层：大面积 GND 铺铜（灯阵回流单独走一条，避免干扰 ADC）', c.x, c.y - 26*Kp);
      ctx.fillStyle = 'rgba(159,176,198,0.85)';
      ctx.font = tiny + 'px "Microsoft YaHei",system-ui,sans-serif';
      ctx.fillText('焊接面：排母焊点 · 阻容焊盘 · 连接器焊脚', c.x, c.y - 8*Kp);
    }
  }

  /* --- 尺寸标尺 --- */
  if (tRuler.checked){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let t = 0; t <= BOARD.w; t += 10){
      [['top', -5.2], ['bot', BOARD.h + 5.2]].forEach(([w, yy]) => {
        const p = project(W3(t, yy, 0.05));
        if (!p) return;
        ctx.font = (t % 20 === 0 ? '600 ' : '') + tiny + 'px "Microsoft YaHei",system-ui,sans-serif';
        ctx.fillStyle = t % 20 === 0 ? '#cfe6f5' : '#7f8fa5';
        ctx.fillText(String(t), p.x, p.y);
      });
    }
    for (let t = 0; t <= BOARD.h; t += 10){
      [-5.6, BOARD.w + 5.6].forEach(xx => {
        const p = project(W3(xx, t, 0.05));
        if (!p) return;
        ctx.font = (t % 20 === 0 ? '600 ' : '') + tiny + 'px "Microsoft YaHei",system-ui,sans-serif';
        ctx.fillStyle = t % 20 === 0 ? '#cfe6f5' : '#7f8fa5';
        ctx.fillText(String(t), p.x, p.y);
      });
    }
    const dx = project(W3(BOARD.w / 2, BOARD.h + 12, 0.05));
    if (dx){ ctx.font = '600 ' + small + 'px "Microsoft YaHei",system-ui,sans-serif';
      ctx.fillStyle = '#41dcff'; ctx.fillText('主板宽 ' + BOARD.w + ' mm', dx.x, dx.y); }
    const dy = project(W3(BOARD.w + 13, BOARD.h / 2, 0.05));
    if (dy){ ctx.font = '600 ' + small + 'px "Microsoft YaHei",system-ui,sans-serif';
      ctx.fillStyle = '#41dcff'; ctx.fillText('主板高 ' + BOARD.h + ' mm', dy.x, dy.y); }
  }

  /* --- 元件标注 --- */
  if (tLabels.checked && (above || below)){
    const placed = [];
    const items = [];
    PARTS.forEach(p => {
      if (!p.anchor) return;
      if (!showPanel && isPanelPart(p.ref)) return;
      const s = project(p.anchor);
      if (!s) return;
      items.push({ p, s });
    });
    items.sort((a, b) => (b.p.pri - a.p.pri) || (b.s.d - a.s.d));

    const fs = Math.max(10.5, 11.5 * Kp);
    ctx.font = '600 ' + fs + 'px "Microsoft YaHei",system-ui,sans-serif';
    const pad = 7 * Kp, lh = fs + 9 * Kp;
    for (const it of items){
      const txt = labelOf(it.p);
      const isSel = it.p.ref === selRef, isHov = PART_PI.get(it.p.ref) === hovPi;
      const w = ctx.measureText(txt).width + pad * 2;
      const h = lh;
      const dx = 15 * Kp, dy = 13 * Kp;
      const cands = [[dx, -h - dy], [dx, dy], [0, -h - dy * 1.7], [0, h + dy * 1.2],
                     [-w - dx, -h - dy], [-w - dx, dy], [dx * 2.2, -h / 2], [-w - dx * 2.2, -h / 2]];
      let bx = null, by = null;
      for (const [ox, oy] of cands){
        const X = it.s.x + ox, Y = it.s.y + oy;
        if (X < 6 || Y < 6 || X + w > VW - 6 || Y + h > VH - 6) continue;
        let hit = false;
        for (const r of placed) if (!(X > r.x + r.w + 4 || X + w < r.x - 4 || Y > r.y + r.h + 4 || Y + h < r.y - 4)){ hit = true; break; }
        if (!hit){ bx = X; by = Y; break; }
      }
      if (bx === null) continue;
      placed.push({ x: bx, y: by, w, h });

      /* 引线 */
      const tx = Math.max(bx, Math.min(it.s.x, bx + w));
      const ty = Math.max(by, Math.min(it.s.y, by + h));
      ctx.beginPath(); ctx.moveTo(it.s.x, it.s.y); ctx.lineTo(tx, ty);
      ctx.strokeStyle = isSel ? 'rgba(65,220,255,0.95)' : 'rgba(150,175,200,0.42)';
      ctx.lineWidth = (isSel ? 1.6 : 1) * Kp; ctx.stroke();
      ctx.beginPath(); ctx.arc(it.s.x, it.s.y, (isSel ? 3.4 : 2.2) * Kp, 0, Math.PI*2);
      ctx.fillStyle = isSel ? '#41dcff' : 'rgba(180,200,220,0.7)'; ctx.fill();

      /* 标签框 */
      rr(bx, by, w, h, 6 * Kp);
      ctx.fillStyle = isSel ? 'rgba(14,42,54,0.97)' : (isHov ? 'rgba(24,36,50,0.95)' : 'rgba(13,18,25,0.86)');
      ctx.fill();
      ctx.strokeStyle = isSel ? '#41dcff' : (isHov ? '#3d7f96' : 'rgba(120,145,175,0.34)');
      ctx.lineWidth = (isSel ? 1.6 : 1) * Kp; ctx.stroke();
      ctx.font = '600 ' + fs + 'px "Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = isSel ? '#d9f8ff' : '#e8eef7';
      ctx.fillText(txt, bx + pad, by + h / 2);
      if (isSel){
        ctx.font = '600 ' + tiny + 'px "Microsoft YaHei",system-ui,sans-serif';
        ctx.fillStyle = '#41dcff';
        ctx.fillText('位置 ' + posOf(it.p) + ' mm', bx + pad, by + h + lh * 0.62);
      }
    }
  }
}

/* ---------- 拾取 ---------- */
function pick(cx, cy){
  const r = cv.getBoundingClientRect();
  const bx = Math.round((cx - r.left) / r.width * RW);
  const by = Math.round((cy - r.top) / r.height * RH);
  if (bx < 0 || by < 0 || bx >= RW || by >= RH) return -1;
  return idBuf[by * RW + bx];
}

/* ---------- 交互 ---------- */
let drag = null;
const ptrs = new Map();
let pinch = null;
function ptrDist(){
  const a = [...ptrs.values()];
  return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
}
cv.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
  cv.classList.add('drag');
  if (ptrs.size >= 2){                       /* 双指：捏合缩放 */
    pinch = { d0: ptrDist(), dist0: cam.dist };
    drag = null;
    return;
  }
  if (e.button === 2) drag = { mode:'pan', x:e.clientX, y:e.clientY, tx:cam.tx, ty:cam.ty, moved:0 };
  else drag = { mode:'rot', x:e.clientX, y:e.clientY, az:cam.az, pitch:cam.pitch, moved:0 };
});
cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && ptrs.size >= 2){
    const d = ptrDist();
    if (d > 10 && pinch.d0 > 10){
      cam.dist = camT.dist = Math.max(60, Math.min(900, pinch.dist0 * pinch.d0 / d));
      animating = false;
    }
    return;
  }
  if (!drag){
    const pi = pick(e.clientX, e.clientY);
    if (pi !== hovPi) hovPi = pi;
    return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
  animating = false;
  if (drag.mode === 'rot'){
    cam.az = drag.az - dx * 0.008;
    cam.pitch = Math.max(0.02, Math.min(Math.PI - 0.02, drag.pitch + dy * 0.006));
    camT.az = cam.az; camT.pitch = cam.pitch;
  } else {
    const s = cam.dist / 900;
    cam.tx = drag.tx - dx * s * basis.xa[0] + dy * s * basis.ya[0];
    cam.ty = drag.ty - dx * s * basis.xa[1] + dy * s * basis.ya[1];
    camT.tx = cam.tx; camT.ty = cam.ty;
  }
});
cv.addEventListener('pointerup', e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  const wasClick = drag && drag.moved < 5 && pinch === null;
  drag = null; cv.classList.remove('drag');
  if (wasClick){
    const pi = pick(e.clientX, e.clientY);
    if (pi >= 0){ const p = PARTS[pi]; if (p) select(p.ref, true); }
    else select('__none__');
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  camT.dist = Math.max(60, Math.min(900, camT.dist * (1 + Math.sign(e.deltaY) * 0.09)));
  cam.dist = camT.dist;
}, { passive:false });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointercancel', e => {
  ptrs.delete(e.pointerId); pinch = null; drag = null; cv.classList.remove('drag');
});

/* 全屏 / 侧栏开关（手机上看模型更方便） */
document.getElementById('btnFull').onclick = () => {
  const el = cv.parentElement;
  if (!document.fullscreenElement){
    if (el.requestFullscreen) el.requestFullscreen();
  } else if (document.exitFullscreen){
    document.exitFullscreen();
  }
};
document.getElementById('btnSide').onclick = () => {
  const app = document.querySelector('.app');
  if (app) app.classList.toggle('hide-side');
};
/* 静态 2D 版与 3D 版互相切换 */
const staticEl = document.getElementById('static');
document.getElementById('btnStatic').onclick = () => {
  if (staticEl) staticEl.style.display = (staticEl.style.display === 'none') ? 'block' : 'none';
};

/* ---------- 主循环 ---------- */
let last = performance.now();
let firstFrame = true;
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (spin){ cam.az += dt * 0.42; camT.az = cam.az; animating = false; }
  if (animating){
    const k = Math.min(1, dt * 6.5);
    cam.az += (camT.az - cam.az) * k;
    cam.pitch += (camT.pitch - cam.pitch) * k;
    cam.dist += (camT.dist - cam.dist) * k;
    if (Math.abs(camT.az - cam.az) < 1e-3 && Math.abs(camT.pitch - cam.pitch) < 1e-3 && Math.abs(camT.dist - cam.dist) < 0.5) animating = false;
  }
  const eK = tExplode.checked ? 1 : 0;
  explodeK += (eK - explodeK) * Math.min(1, dt * 5);

  paintLEDs(now);
  updateBasis();
  const selPi = PART_PI.get(selRef);
  draw3D(explodeK, hovPi, selPi === undefined ? -1 : selPi);
  drawOverlay();
  /* 第一帧画好后收起静态 2D 版，露出可交互的 3D 模型 */
  if (firstFrame){ firstFrame = false; if (staticEl) staticEl.style.display = 'none'; }
  requestAnimationFrame(loop);
}

/* ---------- 启动 ---------- */
function boot(){
  resize();
  fitCamera();
  updateBasis();
  requestAnimationFrame(loop);
}
if (typeof ResizeObserver !== 'undefined'){
  const ro = new ResizeObserver(() => resize());
  ro.observe(cv.parentElement);
} else {
  window.addEventListener('resize', resize);
}
boot();
setView('bottom');
document.getElementById('scalebox').innerHTML =
  '主板 <b>' + BOARD.w + ' × ' + BOARD.h + ' mm</b> · 厚 <b>1.6 mm</b> · 灯阵板 <b>' + PANEL.w + ' × ' + PANEL.h + ' mm</b>'
  + '<br>灯阵 <b>8 × 8</b>（64 颗）· BOM <b>' + PARTS.length + '</b> 项';
</script>
